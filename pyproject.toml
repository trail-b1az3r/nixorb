[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nixorb"
dynamic = ["version"]
description = "Floating AI assistant orb for Arch Linux — KDE Plasma 6 Wayland"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "NixOrb Contributors" }]
keywords = ["ai", "assistant", "wayland", "kde", "llm", "tts", "asr", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "PySide6>=6.7.0",
    "qasync>=0.27.1",
    "faster-whisper>=1.0.3",
    "aiohttp>=3.9.5",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tomli-w>=1.0.0",
    "typer>=0.12.3",
    "chromadb>=0.5.3",
    "pynput>=1.7.6",
    "cryptography>=42.0",
    # Local HuggingFace LLM/ASR/TTS models — needed for the default config,
    # which uses llm_backend="huggingface", asr_backend="huggingface", and
    # tts_backend="huggingface". This deliberately does NOT include torch —
    # it's not here below either, on purpose. torch needs a build matching
    # your actual hardware (CPU, this project's own GTX 1080/cu118 pin, a
    # different CUDA version, ROCm, ...), and there's no one variant that's
    # correct as an unconditional dependency of a publicly-published
    # package: pinning a specific +cu118 local version here previously
    # broke CI's CPU-only runner outright (pip can't satisfy an exact
    # +cu118 build from anywhere but PyTorch's own cu118 index, which
    # nothing here points it at) and would equally break for anyone not on
    # this exact card. Install torch yourself first — see
    # requirements-cuda.txt for the GTX 1080 pin, or plain `pip install
    # torch torchaudio` for CPU/whatever your platform resolves by
    # default — matching the ordering install.sh/install.fish and
    # .github/workflows/ci.yml already use.
    # >= 5.13, not 4.x: that is where Nemotron3_5Asr landed, and the default
    # asr_model is a Nemotron checkpoint. A lower floor resolves happily and
    # then dies inside from_pretrained with an unrecognised-architecture
    # error, which tells the user nothing about what to fix.
    "transformers>=5.13.0",
    "accelerate>=0.33.0",
    "huggingface_hub>=0.24.0",
    # GGUF models via llama.cpp — needed for llm_backend="huggingface" when
    # llm_model/llm_gguf_file points at a GGUF checkpoint (the default does).
    # Pulled via [tool.uv.sources] below on the prebuilt-CPU-wheel index —
    # this model is tiny (~1.3 GB Q4_K_M), CPU inference is plenty fast, and
    # skipping the source build saves several minutes on every fresh install.
    "llama-cpp-python>=0.2.90",
]

[project.optional-dependencies]
dev = [
    # llama.cpp's own GGUF writer — tests/test_gguf_probe.py builds real
    # files with it rather than hand-rolling bytes, since a reader tested
    # only against its own encoder proves nothing about the real format.
    "gguf>=0.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-aiohttp>=1.0",
    "pytest-qt>=4.2",
    "ruff>=0.4",
    "mypy>=1.10",
]
# NOT installed by default (a separate model-training step is required
# before it's useful anyway — see scripts/wakeword_training/).
#
# This is a plain PyPI version pin, not a git+https reference — PyPI
# rejects uploads with direct-URL dependencies in their metadata outright
# (tried it; got "400 Can't have direct dependency"). Which means this
# extra, installed as-is via `pip install nixorb[wakeword]`, still hits
# the tflite-runtime wall on Python 3.12+: PyPI's published openwakeword
# 0.6.0 depends on tflite-runtime>=2.8.0, which never shipped a wheel past
# cp311. That's fixed on openWakeWord's GitHub main branch (migrated to
# ai-edge-litert, which does publish cp312+ wheels) — but a fix that only
# exists as an unreleased git commit can't be expressed in package
# metadata PyPI will accept. To actually get a working install on
# Python 3.12+ today:
#
#   pip install nixorb  # base install, no [wakeword] extra
#   pip install 'openwakeword @ git+https://github.com/dscripka/openWakeWord.git'
#
# Once openWakeWord cuts a new PyPI release with this fix, this extra can
# go back to depending on it normally and that workaround goes away.
wakeword = ["openwakeword>=0.6.0"]
# Any OpenAI-compatible endpoint (real OpenAI, or a local vLLM / TGI /
# LM Studio / llama.cpp server) — llm_backend="openai" or tts_backend="openai".
openai = ["openai>=1.40.0"]

# Extras on top of the base HF stack: SpeechT5 speaker x-vectors live in a
# dataset repo, and several tokenizers need sentencepiece/protobuf.
hf = [
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "datasets>=2.19",
]
# The name people actually type — the setting is `llm_backend = "huggingface"`,
# so `nixorb[huggingface]` is the natural guess, and three error messages in
# this project used to suggest exactly that. pip answers an undeclared extra
# with a warning and installs nothing, so the guess failed silently. Declare
# it as an alias rather than argue with the guess.
huggingface = ["nixorb[hf]"]

# NVIDIA Nemotron 3.5 ASR. transformers >= 5.13 is already the base floor;
# this exists so the requirement is stated where people look for it.
nemotron = [
    "transformers>=5.13",
    "torch>=2.2",
    "soundfile>=0.12.1",
]

# 4-bit quantisation, so a larger transformers model fits beside ASR on 8 GB.
quant = ["bitsandbytes>=0.43"]

# GGUF models via llama.cpp. Already a base dependency — this extra exists
# so the install command the backend prints when it is missing is real.
llama_cpp = ["llama-cpp-python>=0.2.90"]

# Declarative index pins so a plain `pip install .` / `uv tool install .` /
# `uv sync` resolves the right prebuilt wheels with zero manual --index-url
# flags. uv reads this section; plain pip does not — install.sh/install.fish
# pass the same index URLs explicitly on their pip install lines instead.
[tool.uv.sources]
llama-cpp-python = [{ index = "llama-cpu" }]

[[tool.uv.index]]
name = "llama-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[project.scripts]
nixorb = "nixorb.cli:app"

[project.gui-scripts]
nixorb-gui = "nixorb.main:main"

[project.urls]
Homepage = "https://github.com/trail-b1az3r/nixorb"
Repository = "https://github.com/trail-b1az3r/nixorb"
Issues = "https://github.com/trail-b1az3r/nixorb/issues"

[tool.hatch.version]
path = "nixorb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nixorb"]

[tool.hatch.build.targets.wheel.shared-data]
"assets" = "share/nixorb/assets"
"config" = "share/nixorb/config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM117"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
