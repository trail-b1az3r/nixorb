# NixOrb default configuration
# Copy to ~/.config/nixorb/config.toml and customize

# ── Orb UI ─────────────────────────────────────────────────────── #
hotkey = "Ctrl+Alt+Space"
orb_size = 88
orb_opacity = 1.0

# ── ASR ────────────────────────────────────────────────────────── #
# "faster_whisper" (default, CTranslate2 Whisper) or "huggingface" (any
# transformers ASR model/pipeline — distil-whisper, Parakeet, a fine-tune...)
asr_backend = "huggingface"
# A faster-whisper size/repo when asr_backend="faster_whisper" (e.g.
# "large-v3"), or any HF repo id when asr_backend="huggingface" (e.g.
# "openai/whisper-large-v3-turbo", "distil-whisper/distil-large-v3").
asr_model = "nvidia/nemotron-3.5-asr-streaming-0.6b"
asr_language = "en"
# Needed for gated/private HF repos.
hf_token = ""
# Chunk-and-transcribe partial results while you're still talking, instead
# of waiting for silence. Only affects asr_backend="huggingface".
asr_streaming = false
asr_streaming_chunk_seconds = 2.5
# Nemotron only. Its encoder streams natively rather than re-transcribing a
# rolling buffer; this is the latency dial — right-context in 80ms frames:
# 0 | 3 | 6 | 13 → 80 / 320 / 560 / 1120 ms.
asr_nemotron_lookahead = 3
# 0.0 (least sensitive) .. 1.0 (most sensitive to quiet/distant speech).
mic_sensitivity = 0.5
# Preferred input device by name substring, e.g. "USB" — survives reboots
# better than an index, which PipeWire/ALSA can renumber.
microphone_name = ""

# ── LLM ────────────────────────────────────────────────────────── #
# "ollama" (default, local, no API keys), "huggingface" (any local
# transformers or GGUF model), or "openai" (any OpenAI-compatible endpoint —
# real OpenAI, or a local vLLM / TGI / LM Studio / llama.cpp server).
llm_backend = "auto"
# An Ollama tag when llm_backend="ollama", or any HF repo id / local path
# when llm_backend="huggingface", or the served model name when
# llm_backend="openai".
llm_model = "empero-ai/Qwen3.8-2B-Distill-GGUF"
ollama_host = "http://localhost:11434"
# Only used for llm_backend="huggingface" with a multi-file GGUF repo, e.g.
# "model.Q4_K_M.gguf". Leave blank for safetensors, or to auto-pick a GGUF.
# Q4_K_M is the repo's recommended quant — 1.31 GB, comfortable on 8 GB VRAM.
llm_gguf_file = "Qwen3.8-2B-Q4_K_M.gguf"
openai_api_key = ""
openai_base_url = "https://api.openai.com/v1"
llm_max_tokens = 512
llm_temperature = 0.7
# This is a reasoning model — every response opens with a <think>...</think>
# block per its own model card. Nothing in nixorb currently strips that
# before it's spoken/logged; raise it if you want that added.
llm_system_prompt = "You are NixOrb, a voice assistant running on Arch Linux with KDE Plasma 6. You're direct, dryly funny, and don't pad your answers. Keep responses concise unless asked for detail. You can execute bash commands, search the web, capture the screen, and remember conversations."

# Seconds to wait for you to answer the command-confirmation dialog.
action_confirm_timeout = 60.0

# ── TTS ────────────────────────────────────────────────────────── #
# "piper" (default, offline), "glados", "huggingface" (any HF
# text-to-speech pipeline — SpeechT5, Bark, Kokoro...), or "openai".
tts_backend = "huggingface"
# For tts_backend="huggingface": Breeze-TTS-2 is a voice-design model (no
# named presets) — this is fed to it as a natural-language voice instruction.
tts_voice = "A calm, clear-voiced woman with a dry, confident wit and unhurried delivery."
# Speak each sentence as the model produces it, rather than waiting
# for the whole answer. Most of what makes the orb feel responsive.
tts_streaming = true
tts_speed = 1.0
tts_volume = 1.0
# Required when tts_backend="huggingface", e.g. "microsoft/speecht5_tts".
# NOTE: Breeze-TTS-2 needs ~7.7 GB VRAM minimum (12 GB recommended per its
# own card) — see the caveat in the accompanying message before relying on this.
tts_hf_repo = "BreezeBlue/Breeze-TTS-2"

# ── Wake Word ──────────────────────────────────────────────────── #
# Requires the optional extra:  pip install 'nixorb[wakeword]'
wake_word_enabled = false
# A bundled pretrained name (alexa, hey_jarvis, hey_mycroft, timer, weather)
# or a path to a custom-trained .onnx/.tflite model. "hey_nixorb" isn't a
# real model yet — it falls back to hey_jarvis until you train one.
wake_word_model = "hey_nixorb"
wake_word_sensitivity = 0.5

# ── Features ───────────────────────────────────────────────────── #
screen_capture_enabled = true
web_search_enabled = true
web_search_max_results = 4
clipboard_enabled = true

# Ask before running every <ACTION> command the model emits. Turning this
# off lets the model run shell commands on your machine unattended.
require_action_confirmation = true

# Wrap approved commands in a bubblewrap sandbox (read-only filesystem, no
# network). Off by default because it makes most useful commands fail.
sandbox_actions = false
memory_enabled = true
plugins_enabled = true

# ── Conversation ───────────────────────────────────────────────── #
# Triggering while the orb is talking stops it and listens, instead of
# queueing behind the current answer.
barge_in = true
# After answering, keep listening this long for a follow-up without needing
# the hotkey again. 0 disables it.
follow_up_seconds = 6.0
# Cap spoken replies when tts_streaming is off.
tts_max_sentences = 6
# SpeechT5 speaker x-vector: a .npy path, a cmu-arctic-xvectors index, or
# blank for the default voice. Ignored by other models.
tts_hf_speaker = ""

# ── Hugging Face ───────────────────────────────────────────────── #
# "auto" | "cuda" | "cpu"
hf_device = "auto"
# Override the model cache (default: ~/.cache/huggingface).
hf_cache_dir = ""
# Off by default: this executes Python from the model repo.
hf_trust_remote_code = false

# ── T1 API (hypernix) ─────────────────────────────────────────────── #
# Where a turn goes when the local model cannot load. Leave t1_base_url
# blank and nothing here is ever contacted.
#   pip install 'nixorb[t1]'
t1_base_url = ""
t1_api_key = ""
# Blank lets T1 route through your plan's cascade rather than pinning one.
t1_model = ""
t1_timeout = 30.0
# Which local backend "auto" tries before reaching for T1.
llm_local_backend = "huggingface"

# ── Speech synthesis fallbacks ────────────────────────────────────── #
# Tried in order when tts_backend cannot run here. The configured backend
# is always tried first, whatever this says. Piper is not first: it needs
# a separately-installed binary and a downloaded voice.
tts_fallbacks = ["huggingface", "piper", "espeak"]

# ── Web search ────────────────────────────────────────────────────── #
# "auto" scrapes DuckDuckGo first and falls back to hypernix's keyless
# multi-engine search; "hypernix" prefers it; "duckduckgo" pins scraping.
web_search_provider = "auto"
