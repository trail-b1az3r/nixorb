name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, and the ceiling we
        # claim to support. 3.14 removed typing.ByteString, which the
        # ChromaDB dependency chain still reads — see nixorb/compat.py.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 portaudio19-dev ffmpeg \
            libglib2.0-0 libdbus-1-3 \
            qt6-base-dev qt6-declarative-dev \
            python3-dev

      - name: Install Python dependencies (CPU-only torch for CI)
        run: |
          pip install --upgrade pip

          # torch 2.7.1 ships no cp314 wheels — 3.14 support starts much
          # later — so pin it only where it exists and let pip resolve on
          # 3.14 rather than failing the job on a missing build.
          TORCH="torch==2.7.1+cpu torchaudio==2.7.1+cpu"
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            TORCH="torch torchaudio"
          fi

          # download.pytorch.org (and its CDN redirect, download-r2.pytorch.org)
          # has long-standing, well-documented intermittent TLS/connection
          # failures unrelated to this project — retry with backoff instead
          # of failing the whole job on a transient blip.
          for attempt in 1 2 3 4 5; do
            if pip install $TORCH \
                 --index-url https://download.pytorch.org/whl/cpu; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to install torch from PyTorch's CDN after 5 attempts."
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          pip install -e ".[dev]"
          # Mock packages that require GPU or native libs in CI
          pip install sounddevice soundfile numpy

      - name: Lint with ruff
        run: ruff check nixorb/ tests/ --output-format=github

      - name: Type-check with mypy
        run: mypy nixorb/ --ignore-missing-imports

      - name: Run tests
        run: |
          pytest tests/ \
            --ignore=tests/test_vram_manager.py \
            -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          fail_ci_if_error: false
